<!DOCTYPE html>
<html lang="fa">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Amir mohamadizade</title>
  <style>

body {
      margin: 0;
      padding: 0;
      background: linear-gradient(135deg, #1f1c2c, #928dab);
      font-family: 'Tahoma', sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      direction: rtl;

}


    .card {
      background: #434343;
      padding: 2rem;
      border-radius: 20px;
      box-shadow: 0 15px 35px #c3fcfc;
      max-width: 300px;
      text-align: center;
      transition: 0.3s ease;
      position: relative;
      overflow: hidden;
    }

    .card:hover {
      transform: scale(1.05);
    }

    .avatar {
  width: 100px;
  height: 100px;
  border-radius: 50%;
  border: 2px solid #00ffae;
  box-shadow: 0 0 15px rgba(0, 255, 170, 0.4), 0 0 5px rgba(0, 255, 170, 0.6) inset;
  margin-bottom: 1rem;
  transition: 0.3s ease-in-out;
  filter: grayscale(10%) contrast(120%);
}
.avatar:hover {
  transform: rotate(2deg) scale(1.05);
  box-shadow: 0 0 25px rgba(0, 255, 170, 0.6), 0 0 10px rgba(0, 255, 170, 0.8) inset;
}


    h2 {
  margin: 0;
  color: #00ff9c;
  font-family: 'Courier New', monospace;
  font-size: 1.8rem;
  letter-spacing: 2px;
  text-shadow: 0 0 5px #00ff9c, 0 0 10px #00ff9c, 0 0 20px #00ff9c;
  animation: glitch 1.5s infinite;
}

@keyframes glitch {
  0% {
    text-shadow: 0 0 5px #00ff9c, 0 0 10px #00ff9c;
    transform: translate(0);
  }
  20% {
    text-shadow: 2px 0 red;
    transform: translate(-1px, 0);
  }
  40% {
    text-shadow: -2px 0 blue;
    transform: translate(1px, 0);
  }
  60% {
    text-shadow: 0 0 10px #00ff9c;
    transform: translate(0);
  }
  100% {
    text-shadow: 0 0 5px #00ff9c, 0 0 10px #00ff9c;
    transform: translate(0);
  }
}


p {
  color: #d0f0ff;
  font-size: 0.95rem;
  font-family: 'Courier New', monospace;
  background: rgba(255, 255, 255, 0.05);
  padding: 1rem;
  border-radius: 12px;
  border: 1px solid rgba(0, 255, 170, 0.3);
  box-shadow: 0 0 10px rgba(0, 255, 170, 0.2);
  line-height: 1.6;
}


    .btn {
  margin-top: 1.5rem;
  background: linear-gradient(145deg, #6b6b6b, #555);
  color: #f8ffd4;
  font-size: 1rem;
  font-family: 'Courier New', monospace;
  letter-spacing: 1px;
  border: none;
  padding: 0.8rem 1.5rem;
  border-radius: 12px;
  cursor: pointer;
  transition: all 0.3s ease;
  box-shadow: 0 4px 10px rgba(0, 0, 0, 0.3);
}

.btn:hover {
  background: linear-gradient(145deg, #7d7d7d, #676767);
  transform: translateY(-3px);
  box-shadow: 0 6px 14px rgba(0, 255, 0, 0.4);
}


    #matrix {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      opacity: 0.2;
      z-index: 0;
    }

    .content {
      position: relative;
      z-index: 1;
    }





  



.glass-siren-background {
  position: fixed;
  inset: 0;
  background: rgba(30, 30, 40, 0.3); 
  backdrop-filter: blur(10px);
  -webkit-backdrop-filter: blur(10px);
  z-index: -1;
  overflow: hidden;
}


.siren-light {
  position: absolute;
  width: 800px;
  height: 400px;
  border-radius: 50%;
  opacity: 0.40;
  filter: blur(140px);
  animation: siren-move 6s linear infinite;
}

.siren-light.red {
  background: rgba(255, 0, 50, 0.8);
  top: 60%;
  left: -200px;
  animation-delay: 0.5s;
}

.siren-light.blue {
  background: rgba(0, 150, 255, 0.8);
  top: 60%;
  left: -200px;
  animation-delay: 1s;
}

@keyframes siren-move {
  0%   { transform: translateX(0); }
  50%  { transform: translateX(100vw); }
  100% { transform: translateX(0); }
}


  





  </style>


</head>

<body>

  <div class="glass-siren-background">
    <div class="siren-light red"></div>
    <div class="siren-light blue"></div>
  </div>
  

  <div class="card">
    <canvas id="matrix"></canvas>
    <div class="content">
      <img class="avatar" src="https://lh3.googleusercontent.com/a/ACg8ocLNnjWAcqlbvmMWK6RBq_8CQs3QhHBDnF7qwEYGHjc0xqbEjSX1=s192-c-rg-br100" alt="تصویر پروفایل" />
      <h2>ΛMIR</h2>
      <p>network and security<br><br>علاقه‌مند به تکنولوژی‌ های روز دنیا <br> طرفدار اینترنت آزاد </p>

      <button id="call" class="btn">phone number</button>
      <button id="email" class="btn">email address</button>
    </div>
  </div>

  <script>
    document.getElementById("call").addEventListener("click", function () {
      alert("number : 09371122950");
    });

    document.getElementById("email").addEventListener("click", function () {
      alert("email : halliefa601@gmail.com");
    });

   
    const canvas = document.getElementById("matrix");
    const ctx = canvas.getContext("2d");

    canvas.width = canvas.offsetWidth;
    canvas.height = canvas.offsetHeight;

    const binary = "01";
    const fontSize = 14;
    const columns = Math.floor(canvas.width / fontSize);
    const drops = Array(columns).fill(1);

    function drawMatrix() {
      ctx.fillStyle = "rgba(0, 0, 0, 0.1)";
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      ctx.fillStyle = "#00ff00";
      ctx.font = fontSize + "px monospace";

      for (let i = 0; i < drops.length; i++) {
        const text = binary[Math.floor(Math.random() * binary.length)];
        const x = i * fontSize;
        const y = drops[i] * fontSize;
        ctx.fillText(text, x, y);

        if (y > canvas.height && Math.random() > 0.975) {
          drops[i] = 0;
        }

        drops[i]++;
      }
    }

    setInterval(drawMatrix, 50);
  </script>










</body>
</html>
