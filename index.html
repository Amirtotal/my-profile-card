  <title>Amir mohamadizade</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      background: linear-gradient(135deg, #1f1c2c, #928dab);
      font-family: 'Tahoma', sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      direction: rtl;
    }
    .card {
      background: #434343;
      padding: 2rem;
      border-radius: 20px;
      box-shadow: 0 15px 35px #c3fcfc;
      max-width: 300px;
      text-align: center;
      transition: 0.3s ease;
    }
    .card:hover {
      transform: scale(1.05);
    }
    .avatar {
      width: 100px;
      height: 100px;
      border-radius: 50%;
      border: 4px solid #f8ffd4;
      margin-bottom: 1rem;
    }
    h2 {
      margin: 0;
      color: #f8ffd4;
    }
    p {
      color: #f4f4f4;
      font-size: 0.9rem;
    }
    .btn {
      margin-top: 1.5rem;
      background: #827e97;
      color: white;
      border: none;
      padding: 0.7rem 1.2rem;
      border-radius: 10px;
      cursor: pointer;
      transition: 0.3s ease;
    }
    .btn:hover {
      background: #7a6f9b;
    }
  </style>

</head>
